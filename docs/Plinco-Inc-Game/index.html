<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Plinco Inc.</title>
  <script>
    // Cache-bust CSS/JS during active development so Pages rebuilds load fresh.
    var BUST = Date.now();
    document.write('<link rel="stylesheet" href="style.css?t=' + BUST + '">');
  </script>
</head>
<body>
  <main class="wrap">
    <h1>Plinco Inc.</h1>
    <p class="sub">Tap the coin. Drop the ball. Get paid.</p>

    <div class="topbar">
      <div id="goldDisplay" class="gold-display">0g</div>
      <div class="topbar-btns">
        <button id="menuBtn" class="menu-btn" hidden>Upgrades</button>
        <button id="settingsBtn" class="menu-btn icon-btn" aria-label="Settings">&#9881;</button>
      </div>
    </div>

    <canvas id="game" width="400" height="640" aria-label="Plinko game board"></canvas>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>Upgrades</h2>
        <button id="closeBtn" class="close-btn" aria-label="Close">&times;</button>
      </div>
      <div id="upgradeList" class="upgrade-list"></div>
    </div>
  </div>

  <div id="settingsOverlay" class="overlay" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>Settings</h2>
        <button id="settingsCloseBtn" class="close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="upgrade-list">
        <div class="set-row">
          <span class="set-label">Music</span>
          <button id="setMusic" class="toggle" role="switch"></button>
        </div>
        <div class="set-row">
          <span class="set-label">Sound FX</span>
          <button id="setFx" class="toggle" role="switch"></button>
        </div>
        <div class="set-row">
          <span class="set-label">Mute All</span>
          <button id="setMute" class="toggle" role="switch"></button>
        </div>

        <div class="section-label">Debug</div>
        <div class="set-row set-col">
          <div class="set-slider-head">
            <span class="set-label">Add gold</span>
            <span id="dbgGoldNow" class="set-val">0g</span>
          </div>
          <div class="dbg-btns">
            <button id="dbgGold100" class="buy-btn">+100</button>
            <button id="dbgGold500" class="buy-btn">+500</button>
            <button id="dbgGold1k" class="buy-btn">+1K</button>
            <button id="dbgGold10k" class="buy-btn">+10K</button>
          </div>
        </div>
        <div class="set-row set-col">
          <div class="set-slider-head">
            <span class="set-label">Drop &rarr; row 1 gap</span>
            <span id="dbgEntryVal" class="set-val">100px</span>
          </div>
          <input id="dbgEntry" class="slider" type="range" min="12" max="1000" step="1" value="100">
        </div>
        <div class="set-row set-col">
          <div class="set-slider-head">
            <span class="set-label">Last row &rarr; chamber gap</span>
            <span id="dbgGapVal" class="set-val">125px</span>
          </div>
          <input id="dbgGap" class="slider" type="range" min="12" max="1000" step="1" value="125">
        </div>

        <div class="section-label">Game</div>
        <div class="set-row">
          <span class="set-label">Delete game &amp; start over</span>
          <button id="dbgReset" class="buy-btn danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script>document.write('<script src="game.js?t=' + BUST + '"><\/script>');</script>
</body>
</html>
